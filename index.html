    *, *::before, *::after { box-sizing: border-box; }
    /* Home-screen app: status bar + 32px. iOS 26.1+ paints a blur/gradient over the top of
       black-translucent home-screen apps that reaches below the status bar.
       Keeping only a solid strip in that band leaves nothing visible to blur. */
    :root { --top-gap: env(safe-area-inset-top, 0px);
            /* Side insets: iPhone Duo's closed screen puts the status pill in the top-right
               corner and reports it as a right inset; landscape notches report left/right.
               Separate left/right values - the insets can be asymmetric. */
            --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
            /* Corner mode (narrow screens only, see below): --corner-r is the part of the right
               inset treated as a top-right-corner obstruction --corner-h tall instead of a
               full-height strip. 0 everywhere else. */
            --corner-r: 0px; --corner-h: 164px;
            /* Header-only reserve for corner status icons that iOS reports as a full-width top
               inset (which the wide rule below ignores). 0 except wide standalone portrait. */
            --hdr-r: 0px; }
    @media (display-mode: standalone) { :root { --top-gap: calc(env(safe-area-inset-top, 0px) + 32px); } }
    /* Wide Home Screen app (unfolded iPhone Duo, iPad): the status icons sit in the corners,
       clear of the centered column, so skip the top inset (82px on the unfolded Duo in portrait)
       and keep only the 32px blur buffer. */
    @media (display-mode: standalone) and (min-width: 600px) { :root { --top-gap: 32px; } }
    /* ...but then the full-width header (v3.16) reaches the top-right corner, where the
       unfolded Duo's clock/battery sit (~549-642 of 669px wide, y 26-67, from a device
       screenshot). Keep the header's right end clear of them. */
    @media (display-mode: standalone) and (min-width: 600px) and (orientation: portrait) { :root { --hdr-r: 128px; } }
    /* Narrow screen with a right inset = the folded Duo's status pill, which only occupies the
       top-right corner (~164px tall - iOS doesn't report the height, measured from a device
       screenshot, in the Home Screen app). Cover just that corner and give the content below
       the full width; the header and each screen's top row add var(--corner-r) themselves.
       Standalone only: the 164px was measured with the standalone --top-gap, and a browser tab
       lays everything out 32px higher, which would put rows under the cover. */
    @media (display-mode: standalone) and (max-width: 520px) { :root { --corner-r: var(--safe-r); } }
    html, body { margin: 0; padding: 0; background: #080c14; height: 100%; overscroll-behavior: none; font-family: 'Barlow', sans-serif; }
    body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
           padding-top: var(--top-gap); padding-left: var(--safe-l); padding-right: calc(var(--safe-r) - var(--corner-r)); }
    input, button, select, textarea { font-family: inherit; }
    /* No native number-field steppers (desktop browsers show them on focus/hover);
       counts have their own -5/-1/+1/+5 buttons. */
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    * { -webkit-overflow-scrolling: touch; }
    #root { height: 100%; }
    /* Solid cover over the status-bar area (black-translucent lets content scroll
       under it) so iOS 26+'s top-edge blur has nothing translucent to pick up. */
    body::before { content: ""; position: fixed; top: 0; left: 0; right: 0;
                   height: var(--top-gap); background: #080c14; z-index: 1000; }
    /* Opaque cover over the folded Duo's status-pill corner (zero-size elsewhere) */
    body::after { content: ""; position: fixed; top: 0; right: 0; width: var(--corner-r);
                  height: var(--corner-h); background: #080c14; z-index: 1000; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .spinner { animation: spin 0.9s linear infinite; display: inline-block; }
    .offline-banner { animation: fadeIn 0.3s ease; }
    @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }
    .live-dot { animation: livePulse 1.6s ease-in-out infinite; }

  <!-- Service worker for offline shell -->

  <script>
    // Version check: compare the version in the currently-running HTML against what the
    // server actually has right now. Uses a live network fetch (cache:no-store) so that
    // iOS PWA's native page cache can't hide a new deploy.
    //
    // Does NOT reload on its own - a coach mid-entry during a live game shouldn't lose
    // unsaved input to a surprise reload. Instead it stores the pending version and fires
    // a 'pt-update-available' event; the React app (App.js) listens for that and shows a
    // small tappable banner. window.__applyPendingAppUpdate (called from that banner) does
    // the actual cache-clear + reload, on the user's own timing.
    (function() {
      const VERSION_KEY = 'pt_app_version';
      const running = document.querySelector('meta[name="app-version"]')?.content || '';

      function applyUpdate(latest) {
        window.__pendingAppUpdateVersion = latest;
        window.__applyPendingAppUpdate = function() {
          localStorage.setItem(VERSION_KEY, latest);
          const clear = 'caches' in window
            ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))))
            : Promise.resolve();
          clear.then(() => location.reload(true));
        };
        window.dispatchEvent(new CustomEvent('pt-update-available', { detail: { version: latest } }));
      }

      // Always store the running version so we have a baseline.
      if (running) localStorage.setItem(VERSION_KEY, running);

      // Fetch the live page from the network (bypasses every cache layer).
      fetch(location.pathname + '?_v=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Accept': 'text/html' }
      })
      .then(r => r.ok ? r.text() : null)
      .then(html => {
        if (!html) return;
        const m = html.match(/name="app-version"\s+content="([^"]+)"/);
        const latest = m && m[1];
        if (latest && latest !== running) applyUpdate(latest);
      })
      .catch(() => {}); // silent fail when offline
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE = 'pitch-tracker-fb-v6';
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.add(location.href)).then(() => self.skipWaiting()));
          });
          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys().then(keys =>
                Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
              ).then(() => self.clients.claim())
            );
          });
          self.addEventListener('fetch', e => {
            // Let Firebase/network requests pass through uncached
            if (e.request.url.includes('firebaseio.com') ||
                e.request.url.includes('googleapis.com') ||
                e.request.url.includes('gstatic.com')) {
              e.respondWith(fetch(e.request).catch(() => new Response('', {status: 503})));
              return;
            }
            // Network-first for HTML navigation AND every same-origin file
            // (lib/*.js, assets/*, manifest.json) so a deploy is picked up
            // immediately - these aren't version-pinned by URL like the CDN
            // libs below are, so cache-first would serve stale code after a
            // version bump.
            const sameOrigin = new URL(e.request.url).origin === location.origin;
            if (e.request.mode === 'navigate' || sameOrigin) {
              e.respondWith(
                fetch(e.request).then(res => {
                  if (res && res.status === 200) {
                    caches.open(CACHE).then(c => c.put(e.request, res.clone()));
                  }
                  return res;
                }).catch(() => caches.match(e.request))
              );
              return;
            }
            // Cache-first for static, version-pinned third-party CDN assets (React/Babel)
            e.respondWith(
              caches.match(e.request).then(r => r || fetch(e.request).then(res => {
                if (res && res.status === 200 && e.request.method === 'GET') {
                  caches.open(CACHE).then(c => c.put(e.request, res.clone()));
                }
                return res;
              }).catch(() => caches.match(e.request)))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
