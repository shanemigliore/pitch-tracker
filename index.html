// SCREEN: SEASON HISTORY — grouped by game
// ══════════════════════════════════════════════════════════════════════════════
function SeasonHistory({ roster, tournaments, onEditGame, onDeleteGame }) {
  const [year, setYear] = useState(new Date().getFullYear().toString());
  const [filterPitcherId, setFilterPitcherId] = useState("all");
  const [editingGame, setEditingGame] = useState(null);

  const years = [...new Set(roster.flatMap(p=>(p.history||[]).map(h=>(h.date||'').slice(0,4)).filter(Boolean)))].sort().reverse();
  const displayYear = years.includes(year) ? year : (years[0]||year);

  // All entries for this year with pitcher info
  const allEntries = roster.flatMap(p =>
    (p.history||[]).filter(h=>h.date?.startsWith(displayYear))
      .map(h=>({ ...h, playerName:p.name, jersey:p.jersey, pitcherId:p.id }))
  );

  // Group entries into games using sharedGameId when present, else date+opponent+context
  const allGameGroups = (() => {
    const groups = new Map();
    allEntries.forEach(entry => {
      const key = entry.sharedGameId ||
        `${entry.date}|${entry.opponent||""}|${String(entry.isTournament)}|${entry.tournamentId||""}`;
      if (!groups.has(key)) {
        groups.set(key, {
          key,
          date: entry.date,
          opponent: entry.opponent || "",
          isTournament: entry.isTournament || false,
          tournamentName: entry.tournamentName || "",
          tournamentId: entry.tournamentId || null,
          tourneyDay: entry.tourneyDay || null,
          pitchers: [],
        });
      }
      groups.get(key).pitchers.push(entry);
    });
    return [...groups.values()].sort((a,b) => b.date.localeCompare(a.date));
  })();

  // When a pitcher is filtered, show only games where that pitcher appeared
  const gameGroups = filterPitcherId==="all"
    ? allGameGroups
    : allGameGroups.filter(g => g.pitchers.some(p => String(p.pitcherId)===String(filterPitcherId)));

  // Stats scoped to filtered pitcher (or all)
  const filteredEntries = filterPitcherId==="all"
    ? allEntries
    : allEntries.filter(e => String(e.pitcherId)===String(filterPitcherId));
  const totalPitches = filteredEntries.reduce((s,g)=>s+g.pitches, 0);
  const distinctGameCount = gameGroups.length;

  const pitchersWithGames = roster.filter(p=>(p.history||[]).some(h=>h.date?.startsWith(displayYear)));

  const leaderboard = roster.map(p=>{
    const games = (p.history||[]).filter(h=>h.date?.startsWith(displayYear));
    return { id:p.id, name:p.name, jersey:p.jersey, games:games.length,
      total:games.reduce((s,g)=>s+g.pitches,0),
      avg:games.length?Math.round(games.reduce((s,g)=>s+g.pitches,0)/games.length):0 };
  }).filter(p=>p.games>0).sort((a,b)=>b.total-a.total);

  const activePitcher = filterPitcherId!=="all" ? roster.find(p=>String(p.id)===String(filterPitcherId)) : null;

  return (
    <div style={{ padding:"0 16px 110px" }}>
      {editingGame && (
        <EditGameGroupModal
          game={editingGame}
          tournaments={tournaments}
          onEditGame={onEditGame}
          onDeleteGame={onDeleteGame}
          onClose={()=>setEditingGame(null)}/>
      )}

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"16px 0 14px" }}>
        <div>
          <h2 style={{ margin:0, fontSize:24, fontWeight:800, color:"#f8fafc", fontFamily:"'Bebas Neue',cursive", letterSpacing:2 }}>HISTORY</h2>
          <p style={{ margin:0, fontSize:12, color:"rgba(255,255,255,0.4)" }}>{distinctGameCount} game{distinctGameCount!==1?"s":""} · {filteredEntries.length} appearance{filteredEntries.length!==1?"s":""}</p>
        </div>
        {years.length>1 && (
          <select value={displayYear} onChange={e=>setYear(e.target.value)}
            style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)",
              borderRadius:10, padding:"6px 10px", color:"#f8fafc", fontSize:14 }}>
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      {/* Pitcher filter */}
      {pitchersWithGames.length > 1 && (
        <div style={card}>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8 }}>
            {I.filter}
            <p style={{ ...sectionLabel, margin:0 }}>FILTER BY PITCHER</p>
          </div>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
            <button onClick={()=>setFilterPitcherId("all")}
              style={{ padding:"6px 12px", borderRadius:20,
                border:`1px solid ${filterPitcherId==="all"?"#38bdf8":"rgba(255,255,255,0.1)"}`,
                background:filterPitcherId==="all"?"rgba(56,189,248,0.15)":"rgba(255,255,255,0.04)",
                color:filterPitcherId==="all"?"#38bdf8":"rgba(255,255,255,0.5)",
                fontSize:12, fontWeight:700, cursor:"pointer" }}>
              All Pitchers
            </button>
            {pitchersWithGames.map(p=>(
              <button key={p.id} onClick={()=>setFilterPitcherId(String(p.id))}
                style={{ padding:"6px 12px", borderRadius:20,
                  border:`1px solid ${String(filterPitcherId)===String(p.id)?"#38bdf8":"rgba(255,255,255,0.1)"}`,
                  background:String(filterPitcherId)===String(p.id)?"rgba(56,189,248,0.15)":"rgba(255,255,255,0.04)",
                  color:String(filterPitcherId)===String(p.id)?"#38bdf8":"rgba(255,255,255,0.5)",
                  fontSize:12, fontWeight:700, cursor:"pointer" }}>
                {p.jersey?`#${p.jersey} `:""}{p.name}
              </button>
            ))}
          </div>
        </div>
      )}

      {gameGroups.length===0 ? (
        <div style={{ textAlign:"center", padding:"60px 0", color:"rgba(255,255,255,0.2)" }}>
          <div style={{ fontSize:56, marginBottom:12 }}>📊</div>
          <p style={{ fontSize:15, fontWeight:600 }}>
            {filterPitcherId==="all" ? `No games logged for ${displayYear}` : `No games for ${activePitcher?.name} in ${displayYear}`}
          </p>
        </div>
      ) : (
        <>
          {/* Summary stats */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, marginBottom:12 }}>
            {[["Total",totalPitches+"p","#38bdf8"],
              ["Games",distinctGameCount,"#4ade80"],
              ["Tourney",gameGroups.filter(g=>g.isTournament).length,"#f59e0b"]
            ].map(([l,v,c])=>(
              <div key={l} style={{ textAlign:"center", padding:"12px 6px", background:"rgba(255,255,255,0.03)",
                border:"1px solid rgba(255,255,255,0.07)", borderRadius:12 }}>
                <div style={{ fontSize:22, fontWeight:900, color:c, fontFamily:"'Bebas Neue',cursive" }}>{v}</div>
                <div style={{ fontSize:10, color:"rgba(255,255,255,0.35)" }}>{l}</div>
              </div>
            ))}
          </div>

          {/* Leaderboard — only when showing all pitchers */}
          {filterPitcherId==="all" && leaderboard.length===0 && (
            <div style={{ ...card, textAlign:"center", padding:"28px 16px", color:"rgba(255,255,255,0.3)" }}>
              <div style={{ fontSize:32, marginBottom:8 }}>📊</div>
              <p style={{ margin:0, fontSize:13, fontWeight:600 }}>No games logged for {displayYear}</p>
              <p style={{ margin:"4px 0 0", fontSize:12 }}>Log a game to see the leaderboard</p>
            </div>
          )}
          {filterPitcherId==="all" && leaderboard.length>0 && (
            <div style={card}>
              <p style={sectionLabel}>LEADERBOARD</p>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 54px 48px 54px", columnGap:8,
                marginBottom:6, paddingBottom:6, borderBottom:"1px solid rgba(255,255,255,0.07)" }}>
                <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)", fontWeight:700, letterSpacing:1 }}>PLAYER</span>
                <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)", fontWeight:700, letterSpacing:1, textAlign:"right" }}>GAMES</span>
                <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)", fontWeight:700, letterSpacing:1, textAlign:"right" }}>AVG</span>
                <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)", fontWeight:700, letterSpacing:1, textAlign:"right" }}>TOT</span>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 54px 48px 54px", columnGap:8 }}>
                {leaderboard.map((p,i)=>(
                  <React.Fragment key={p.id}>
                    <div onClick={()=>setFilterPitcherId(String(p.id))}
                      style={{ display:"flex", alignItems:"center", gap:7, cursor:"pointer",
                        padding:"7px 0", borderBottom:i<leaderboard.length-1?"1px solid rgba(255,255,255,0.04)":"none" }}>
                      <span style={{ width:20, height:20, borderRadius:6,
                        background:i===0?"rgba(251,191,36,0.2)":i===1?"rgba(156,163,175,0.15)":i===2?"rgba(180,120,60,0.15)":"rgba(255,255,255,0.04)",
                        display:"flex", alignItems:"center", justifyContent:"center",
                        fontSize:10, fontWeight:800, color:i===0?"#fbbf24":i===1?"#9ca3af":i===2?"#b47a3c":"rgba(255,255,255,0.3)", flexShrink:0 }}>
                        {i+1}
                      </span>
                      <span style={{ fontSize:13, color:"rgba(255,255,255,0.8)", fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.jersey?`#${p.jersey} `:""}{p.name}</span>
                    </div>
                    <span onClick={()=>setFilterPitcherId(String(p.id))} style={{ fontSize:13, color:"rgba(255,255,255,0.5)", fontFamily:"'DM Mono',monospace", textAlign:"right", cursor:"pointer",
                      padding:"7px 0", borderBottom:i<leaderboard.length-1?"1px solid rgba(255,255,255,0.04)":"none", display:"flex", alignItems:"center", justifyContent:"flex-end" }}>{p.games}</span>
                    <span onClick={()=>setFilterPitcherId(String(p.id))} style={{ fontSize:13, color:"#38bdf8", fontFamily:"'DM Mono',monospace", textAlign:"right", cursor:"pointer",
                      padding:"7px 0", borderBottom:i<leaderboard.length-1?"1px solid rgba(255,255,255,0.04)":"none", display:"flex", alignItems:"center", justifyContent:"flex-end" }}>{p.avg}p</span>
                    <span onClick={()=>setFilterPitcherId(String(p.id))} style={{ fontSize:13, color:"#f8fafc", fontFamily:"'DM Mono',monospace", fontWeight:700, textAlign:"right", cursor:"pointer",
                      padding:"7px 0", borderBottom:i<leaderboard.length-1?"1px solid rgba(255,255,255,0.04)":"none", display:"flex", alignItems:"center", justifyContent:"flex-end" }}>{p.total}p</span>
                  </React.Fragment>
                ))}
              </div>
              <p style={{ margin:"8px 0 0", fontSize:10, color:"rgba(255,255,255,0.25)" }}>Tap a player to filter their games</p>
            </div>
          )}

          {/* Filtered pitcher summary */}
          {activePitcher && (
            <div style={{ ...card, border:"1px solid rgba(56,189,248,0.2)", background:"rgba(56,189,248,0.04)" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:15, fontWeight:800, color:"#38bdf8" }}>{activePitcher.jersey?`#${activePitcher.jersey} `:""}{activePitcher.name}</div>
                  <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginTop:2 }}>
                    {distinctGameCount} game{distinctGameCount!==1?"s":""} · {totalPitches}p total · avg {distinctGameCount?Math.round(totalPitches/distinctGameCount):0}p/game
                  </div>
                </div>
                <Chip status={getAvailabilityStatus(activePitcher, null, tournaments)} size="lg"/>
              </div>
            </div>
          )}

          {/* Games — one card per game, tap to edit */}
          {gameGroups.map((g,gi) => {
            const gameTotalPitches = g.pitchers.reduce((s,p)=>s+p.pitches, 0);
            return (
              <div key={g.key||gi} style={card}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:14, fontWeight:700, color:"#f8fafc" }}>
                      {formatDate(g.date)}
                      {g.opponent && <span style={{ fontWeight:400, color:"rgba(255,255,255,0.5)" }}> · vs {g.opponent}</span>}
                    </div>
                    {g.isTournament ? (
                      <span style={{ fontSize:10, padding:"2px 7px", background:"rgba(245,158,11,0.15)",
                        border:"1px solid rgba(245,158,11,0.3)", borderRadius:6, color:"#f59e0b", fontWeight:700,
                        display:"inline-block", marginTop:4 }}>
                        🏆 {g.tournamentName||"TOURNAMENT"}{g.tourneyDay?` · DAY ${g.tourneyDay}`:""}
                      </span>
                    ) : (
                      <span style={{ fontSize:10, color:"rgba(255,255,255,0.3)", marginTop:2, display:"block" }}>
                        Regular Season
                      </span>
                    )}
                  </div>
                  <button onClick={()=>setEditingGame(g)}
                    style={{ display:"flex", alignItems:"center", gap:5, padding:"6px 10px",
                      background:"rgba(56,189,248,0.08)", border:"1px solid rgba(56,189,248,0.2)",
                      borderRadius:8, color:"#38bdf8", fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0 }}>
                    {I.edit} Edit
                  </button>
                </div>
                {g.pitchers.map((p,pi) => {
                  const rd = getRegRestDays(p.pitches);
                  return (
                    <div key={p.gameId||pi} style={{ display:"flex", alignItems:"center", gap:8,
                      padding:"7px 10px", borderRadius:9, marginBottom:4,
                      background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.05)" }}>
                      <div style={{ width:28, height:28, borderRadius:7,
                        background:"rgba(56,189,248,0.1)", border:"1px solid rgba(56,189,248,0.2)",
                        display:"flex", alignItems:"center", justifyContent:"center",
                        fontFamily:"'Bebas Neue',cursive", fontSize:11, color:"#38bdf8", flexShrink:0 }}>
                        {p.jersey?`#${p.jersey}`:(p.playerName||"?")[0]}
                      </div>
                      <span style={{ flex:1, fontSize:13, fontWeight:600, color:"rgba(255,255,255,0.85)" }}>{p.playerName}</span>
                      <span style={{ fontSize:15, fontWeight:800, color:"#f8fafc", fontFamily:"'Bebas Neue',cursive" }}>{p.pitches}p</span>
                      <span style={{ fontSize:11, fontWeight:600, minWidth:44, textAlign:"right",
                        color:rd===0?"#4ade80":rd===1?"#a3e635":rd===2?"#fb923c":"#f43f5e" }}>
                        {rd===0?"No rest":`${rd}d rest`}
                      </span>
                    </div>
                  );
                })}
                {g.pitchers.length > 1 && (
                  <div style={{ paddingTop:6, marginTop:2, borderTop:"1px solid rgba(255,255,255,0.05)",
                    fontSize:11, color:"rgba(255,255,255,0.3)", textAlign:"right" }}>
                    {gameTotalPitches}p combined
                  </div>
                )}
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

// TEAM PICKER — Select or create a team
// ══════════════════════════════════════════════════════════════════════════════
function TeamPickerScreen({ onSelect, showManage, onTeamMetaUpdate }) {
  const [teams, setTeams]       = useState([]);
  const [loading, setLoading]   = useState(true);
  const [creating, setCreating] = useState(false);
  const [managing, setManaging] = useState(null); // team object being managed
  const [newName, setNewName]   = useState("");
  const [newRules, setNewRules] = useState({ ...DEFAULT_RULES });
  const [saving, setSaving]     = useState(false);
  const [renameName, setRenameName] = useState("");
  const [editRules, setEditRules]   = useState({ ...DEFAULT_RULES });
  const [deletePhase, setDeletePhase] = useState("idle");
  const [deleteText, setDeleteText]   = useState("");
  const [hoveredTeamId, setHoveredTeamId] = useState(null);

  useEffect(() => {
    Promise.all([window.__fbMigrateIfNeeded(), window.__fbCreatePrime12U(), window.__fbCreatePrime10U()]).then(() =>
      window.__fbListTeams().then(list => { setTeams(list); setLoading(false); })
    );
  }, []);

  function refreshTeams() {
    window.__fbListTeams().then(list => setTeams(list));
  }

  function handleCreate() {
    if (!newName.trim() || saving) return;
    const rules = {
      maxPitches: Math.max(1, parseInt(newRules.maxPitches)||55),
      rest1: Math.max(0, parseInt(newRules.rest1)||20),
      rest2: Math.max(0, parseInt(newRules.rest2)||40),
      rest3: Math.max(0, parseInt(newRules.rest3)||60),
    };
    const teamId = newId();
    const meta   = { name: newName.trim(), rules, createdAt: todayStr() };
    setSaving(true);
    window.__fbCreateTeam(teamId, meta).then(() => {
      setSaving(false);
      setCreating(false);
      setNewName("");
      setNewRules({ ...DEFAULT_RULES });
      onSelect(teamId, meta);
    }).catch(() => setSaving(false));
  }

  function handleSaveChanges() {
    if (!renameName.trim() || !managing) return;
    const rules = {
      maxPitches: Math.max(1, parseInt(editRules.maxPitches)||55),
      rest1: Math.max(0, parseInt(editRules.rest1)||20),
      rest2: Math.max(0, parseInt(editRules.rest2)||40),
      rest3: Math.max(0, parseInt(editRules.rest3)||60),
    };
    const updatedMeta = { name: renameName.trim(), rules };
    window.__fbUpdateTeamMeta(managing.id, updatedMeta).then(() => {
      if (onTeamMetaUpdate) onTeamMetaUpdate(managing.id, updatedMeta);
      refreshTeams();
      setManaging(null);
    });
  }

  function handleDelete() {
    if (deleteText !== "DELETE TEAM" || !managing) return;
    window.__fbDeleteTeam(managing.id).then(() => {
      refreshTeams();
      setManaging(null);
      setDeletePhase("idle");
      setDeleteText("");
    });
  }

  const ruleField = (label, key, hint) => (
    <div style={{ marginBottom:10 }}>
      <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>{label}</label>
      <input type="number" min="0" value={newRules[key]}
        onChange={e=>setNewRules(r=>({...r,[key]:e.target.value}))}
        style={{ ...inputStyle, marginBottom:2 }}/>
      {hint && <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)" }}>{hint}</div>}
    </div>
  );

  return (
    <div style={{ background:"#080c14", minHeight:"100vh", padding:"0 16px 40px",
      fontFamily:"'Barlow',sans-serif", color:"#f8fafc",
      backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(30,58,138,0.25) 0%,transparent 60%)" }}>

      {/* Header */}
      <div style={{ padding:"32px 0 20px", display:"flex", alignItems:"center", gap:14 }}>
        <img src={LOGO_URI} alt="Prime Baseball" style={{ width:52, height:52, borderRadius:"50%", flexShrink:0 }}/>
        <div>
          <div style={{ fontSize:26, fontWeight:900, color:"#f8fafc", fontFamily:"'Bebas Neue',cursive", letterSpacing:2, lineHeight:1 }}>PRIME PITCHING</div>
          <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginTop:2 }}>
            {showManage ? "Switch or manage teams" : "Select your team to get started"}
          </div>
        </div>
      </div>

      {/* Team list */}
      {loading ? (
        <div style={{ textAlign:"center", padding:"40px 0", color:"rgba(255,255,255,0.3)", fontSize:14 }}>Loading teams…</div>
      ) : (
        <div style={{ ...card, marginBottom:12 }}>
          <p style={sectionLabel}>TEAMS</p>
          {teams.length === 0 && (
            <div style={{ fontSize:13, color:"rgba(255,255,255,0.3)", paddingBottom:4 }}>No teams yet — create one below.</div>
          )}
          {teams.map(t => (
            <div key={t.id}
              onMouseEnter={()=>setHoveredTeamId(t.id)} onMouseLeave={()=>setHoveredTeamId(null)}
              style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 8px", margin:"0 -8px",
                borderRadius:10, borderBottom:"1px solid rgba(255,255,255,0.05)",
                background:hoveredTeamId===t.id?"rgba(255,255,255,0.05)":"transparent",
                transition:"background 0.15s" }}>
              <button onClick={()=>onSelect(t.id, t)}
                style={{ flex:1, textAlign:"left", background:"transparent", border:"none",
                  cursor:"pointer", padding:0 }}>
                <div style={{ fontSize:15, fontWeight:700, color:hoveredTeamId===t.id?"#fff":"#f8fafc" }}>{t.name}</div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginTop:2 }}>
                  Max {t.rules?.maxPitches||55}p · Rest: {t.rules?.rest1||20}/{t.rules?.rest2||40}/{t.rules?.rest3||60}
                </div>
              </button>
              <button onClick={()=>{ setManaging(t); setRenameName(t.name); setEditRules(t.rules||{...DEFAULT_RULES}); setDeletePhase("idle"); setDeleteText(""); }}
                style={{ background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.1)",
                  borderRadius:8, padding:"5px 10px", color:"rgba(255,255,255,0.5)", cursor:"pointer", fontSize:12 }}>
                ···
              </button>
            </div>
          ))}
        </div>
      )}

      {/* Create new team */}
      {!creating ? (
        <button onClick={()=>setCreating(true)}
          style={{ ...primaryBtn, width:"100%", marginBottom:16 }}>
          + Create New Team
        </button>
      ) : (
        <div style={{ ...card, border:"1px solid rgba(56,189,248,0.2)", marginBottom:16 }}>
          <p style={{ ...sectionLabel, color:"#38bdf8" }}>NEW TEAM</p>
          <div style={{ marginBottom:10 }}>
            <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>TEAM NAME</label>
            <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="e.g. Prime 10U"
              style={inputStyle}/>
          </div>
          <p style={{ ...sectionLabel, marginTop:14, marginBottom:10 }}>PITCH COUNT RULES</p>
          {ruleField("Game max pitches", "maxPitches", "Maximum pitches allowed per game")}
          {ruleField("0→1 rest-day breakpoint", "rest1", "Pitches above this require 1 day rest")}
          {ruleField("1→2 rest-day breakpoint", "rest2", "Pitches above this require 2 days rest")}
          {ruleField("2→3 rest-day breakpoint", "rest3", "Pitches above this require 3 days rest")}
          <div style={{ display:"flex", gap:8, marginTop:4 }}>
            <button onClick={()=>{ setCreating(false); setNewName(""); setNewRules({...DEFAULT_RULES}); }} style={cancelBtn}>Cancel</button>
            <button onClick={handleCreate} disabled={!newName.trim()||saving}
              style={{ ...primaryBtn, flex:2, opacity:!newName.trim()||saving?0.5:1 }}>
              {saving ? "Creating…" : "Create Team"}
            </button>
          </div>
        </div>
      )}

      {/* Manage modal */}
      {managing && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", zIndex:60,
          display:"flex", alignItems:"flex-end", justifyContent:"center" }}
          onClick={e=>{ if(e.target===e.currentTarget){ setManaging(null); setDeletePhase("idle"); setDeleteText(""); } }}>
          <div style={{ width:"100%", maxWidth:430, background:"#0f1623",
            border:"1px solid rgba(255,255,255,0.12)", borderRadius:"20px 20px 0 0",
            padding:"20px 18px 48px", fontFamily:"'Barlow',sans-serif",
            maxHeight:"85vh", overflowY:"auto" }}>

            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18 }}>
              <div style={{ fontSize:16, fontWeight:800, color:"#f8fafc" }}>{managing.name}</div>
              <button onClick={()=>{ setManaging(null); setDeletePhase("idle"); setDeleteText(""); }}
                style={{ background:"rgba(255,255,255,0.07)", border:"none", borderRadius:8,
                  width:32, height:32, color:"rgba(255,255,255,0.5)", cursor:"pointer" }}>✕</button>
            </div>

            {deletePhase === "idle" && (
              <>
                <div style={{ ...card, border:"1px solid rgba(56,189,248,0.2)", marginBottom:12 }}>
                  <p style={{ ...sectionLabel, color:"#38bdf8" }}>EDIT TEAM</p>
                  <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>TEAM NAME</label>
                  <input value={renameName} onChange={e=>setRenameName(e.target.value)}
                    style={{ ...inputStyle, marginBottom:12 }}/>
                  <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>GAME MAX PITCHES</label>
                  <input type="number" min="1" value={editRules.maxPitches}
                    onChange={e=>setEditRules(r=>({...r,maxPitches:e.target.value}))}
                    style={{ ...inputStyle, marginBottom:4 }}/>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginBottom:10 }}>Maximum pitches allowed per game</div>
                  <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>0→1 REST-DAY BREAKPOINT</label>
                  <input type="number" min="0" value={editRules.rest1}
                    onChange={e=>setEditRules(r=>({...r,rest1:e.target.value}))}
                    style={{ ...inputStyle, marginBottom:4 }}/>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginBottom:10 }}>Pitches above this require 1 day rest</div>
                  <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>1→2 REST-DAY BREAKPOINT</label>
                  <input type="number" min="0" value={editRules.rest2}
                    onChange={e=>setEditRules(r=>({...r,rest2:e.target.value}))}
                    style={{ ...inputStyle, marginBottom:4 }}/>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginBottom:10 }}>Pitches above this require 2 days rest</div>
                  <label style={{ ...sectionLabel, display:"block", marginBottom:4 }}>2→3 REST-DAY BREAKPOINT</label>
                  <input type="number" min="0" value={editRules.rest3}
                    onChange={e=>setEditRules(r=>({...r,rest3:e.target.value}))}
                    style={{ ...inputStyle, marginBottom:12 }}/>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginBottom:12 }}>Pitches above this require 3 days rest</div>
                  <button onClick={handleSaveChanges} disabled={!renameName.trim()}
                    style={{ ...primaryBtn, width:"100%", opacity:!renameName.trim()?0.5:1 }}>Save Changes</button>
                </div>
                <div style={{ ...card, border:"1px solid rgba(244,63,94,0.15)" }}>
                  <p style={{ ...sectionLabel, color:"#f43f5e" }}>DANGER ZONE</p>
                  <button onClick={()=>setDeletePhase("confirm")}
                    style={{ background:"transparent", border:"1px solid rgba(220,38,38,0.4)",
                      borderRadius:8, padding:"5px 12px", color:"rgba(220,38,38,0.7)", cursor:"pointer",
                      fontSize:11, fontWeight:600, letterSpacing:0.3 }}>
                    Delete Team
                  </button>
                </div>
              </>
            )}

            {deletePhase === "confirm" && (
              <div style={{ ...card, border:"1px solid rgba(244,63,94,0.3)" }}>
                <p style={{ fontSize:14, color:"#f87171", fontWeight:700, marginBottom:8 }}>
                  Delete "{managing.name}"?
                </p>
                <p style={{ fontSize:13, color:"rgba(255,255,255,0.5)", marginBottom:16, lineHeight:1.5 }}>
                  All roster and game history will be archived. This cannot be undone from the app.
                  Type <strong style={{color:"#f87171"}}>DELETE TEAM</strong> to confirm.
                </p>
                <input value={deleteText} onChange={e=>setDeleteText(e.target.value)}
                  placeholder="DELETE TEAM" style={{ ...inputStyle, marginBottom:10 }}/>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={()=>{ setDeletePhase("idle"); setDeleteText(""); }} style={cancelBtn}>Cancel</button>
                  <button onClick={handleDelete} disabled={deleteText !== "DELETE TEAM"}
                    style={{ ...primaryBtn, flex:2, background:"linear-gradient(135deg,#dc2626,#b91c1c)",
                      opacity:deleteText!=="DELETE TEAM"?0.4:1 }}>

            )}

        </div>
      )}
    </div>
  );

// ROOT APP
// ══════════════════════════════════════════════════════════════════════════════
const TABS = [
  { id:"roster",      label:"Roster",      icon:I.roster      },
  { id:"gamelog",     label:"Game Log",    icon:I.gamelog     },
  { id:"eligibility", label:"Eligibility", icon:I.eligibility },
  { id:"tournament",  label:"Tourney",     icon:I.tournament  },
  { id:"history",     label:"History",     icon:I.history     },
  { id:"activity",    label:"Activity",    icon:I.activity    },
];

const TEAM_ID_KEY = "pt_selected_team_id";
const TEAM_META_KEY = "pt_selected_team_meta";

class ScreenBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) { console.error("Screen render error:", error); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding:"20px 16px" }}>
          {this.props.onBack && (
            <button onClick={this.props.onBack}
              style={{ background:"rgba(255,255,255,0.07)", border:"none", borderRadius:10,
                padding:10, color:"rgba(255,255,255,0.7)", cursor:"pointer", display:"flex", marginBottom:16 }}>
              ← Back to Roster
            </button>
          )}
          <div style={{ background:"rgba(244,63,94,0.08)", border:"1px solid rgba(244,63,94,0.25)",
            borderRadius:14, padding:16 }}>
            <div style={{ color:"#f43f5e", fontWeight:700, marginBottom:8 }}>Something went wrong</div>
            <pre style={{ fontSize:11, color:"rgba(255,255,255,0.5)", margin:0, whiteSpace:"pre-wrap",
              wordBreak:"break-all", maxHeight:200, overflowY:"auto" }}>{String(this.state.error)}</pre>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  // ── Team selection ──────────────────────────────────────────────────────
  const [teamId,   setTeamId]   = useState(() => localStorage.getItem(TEAM_ID_KEY) || null);
  const [teamMeta, setTeamMeta] = useState(() => {
    try { return JSON.parse(localStorage.getItem(TEAM_META_KEY)) || null; } catch { return null; }
  });
  const [showTeamPicker, setShowTeamPicker] = useState(false);

  // Keep currentRules in sync on every render (before any child renders read it)
  setCurrentRules(teamMeta?.rules || DEFAULT_RULES);

  function selectTeam(id, meta) {
    // Same team — just close the picker, nothing to reload
    if (id === teamId) {
      setShowTeamPicker(false);
      return;
    }
    localStorage.setItem(TEAM_ID_KEY, id);
    localStorage.setItem(TEAM_META_KEY, JSON.stringify(meta));
    setCurrentRules(meta?.rules || DEFAULT_RULES);
    setTeamId(id);
    setTeamMeta(meta);
    setShowTeamPicker(false);
    // Reset app data for the new team
    setRoster([]);
    setTournaments([]);
    setLoaded(false);
    setTab("roster");
    setSelectedPlayer(null);
  }

  // ── App data ────────────────────────────────────────────────────────────
  const [roster,      setRoster]      = useState([]);
  const [tournaments, setTournaments] = useState([]);
  const [tab,         setTab]         = useState("roster");
  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [loaded,      setLoaded]      = useState(false);
  const [syncStatus,  setSyncStatus]  = useState("connecting");
  const [auditLog,    setAuditLog]    = useState([]);
  const [undidIds,    setUndidIds]    = useState(new Set());

  // Refs for stale-closure-free access inside callbacks
  const rosterRef      = useRef(roster);       rosterRef.current      = roster;
  const tournamentsRef = useRef(tournaments);  tournamentsRef.current = tournaments;
  const teamIdRef      = useRef(teamId);       teamIdRef.current      = teamId;

  // Firebase real-time listener — re-subscribes when teamId changes
  useEffect(()=>{
    if (!teamId || !window.__fbSubscribe) {
      setLoaded(true);
      setSyncStatus(teamId ? "offline" : "connecting");
      return;
    }
    setSyncStatus("connecting");
    setLoaded(false);
    let unsubFn = null;
    // Run seeds first (ensures rules exist in Firebase), then refresh teamMeta,
    // then start the subscription — so rules are always correct before roster renders.
    Promise.all([
      window.__fbMigrateIfNeeded?.() || Promise.resolve(),
      window.__fbCreatePrime12U?.()  || Promise.resolve(),
      window.__fbCreatePrime10U?.()  || Promise.resolve(),
    ]).then(() => window.__fbListTeams()).then(list => {
      const fresh = list.find(t => t.id === teamId);
      if (fresh) {
        localStorage.setItem(TEAM_META_KEY, JSON.stringify(fresh));
        setTeamMeta(fresh);
      }
      unsubFn = window.__fbSubscribe(
        (data) => {
          setRoster(data.roster || []);
          setTournaments(data.tournaments || []);
          setLoaded(true);
          setSyncStatus("synced");
        },
        () => setSyncStatus(prev => prev === "connecting" ? prev : "synced"),
        () => setSyncStatus("offline"),
        teamId
      );
    });
    return () => { if (unsubFn) unsubFn(); };
  }, [teamId]);

  // Subscribe to audit log for current team
  useEffect(() => {
    if (!teamId || !window.__fbWatchAudit) return;
    setAuditLog([]);
    setUndidIds(new Set());
    // Capture teamId so the callback can detect if it fires after the team changed.
    // Without this guard, a stale callback from a previous team fires after the new
    // team's callback and can wipe out the new entries (since confirmed entries have
    // no _local flag and get replaced by the stale team's empty-or-wrong entries).
    const subscribedTeamId = teamId;
    const unsub = window.__fbWatchAudit(teamId, entries => {
      if (teamIdRef.current !== subscribedTeamId) return;
      // Merge: keep local optimistic entries not yet confirmed in Firebase, then add Firebase data
      const fbIds = new Set(entries.map(e => e.id));
      setAuditLog(prev => {
        const unconfirmed = prev.filter(e => e._local && !fbIds.has(e.id));
        return [...unconfirmed, ...entries];
      });
      setUndidIds(prev => {
        const fromDb = new Set(entries.filter(e => e.undone).map(e => e.id));
        return new Set([...prev, ...fromDb]);
      });
    });
    return () => unsub();
  }, [teamId]);

  // Write to Firebase whenever data changes (after initial load)
  const saveTimeoutRef = useRef(null);
  useEffect(()=>{
    if (!loaded || !teamId || !window.__fbSet) return;
    setSyncStatus("saving");
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      Promise.all([
        window.__fbSet("roster", roster, teamId),
        window.__fbSet("tournaments", tournaments, teamId),
      ]).then(() => setSyncStatus("synced"))
        .catch(() => setSyncStatus("offline"));
    }, 600);
  }, [roster, tournaments, loaded]);

  function pushAudit(action, detail, undoData, extra) {
    try {
      const tid = teamIdRef.current;
      if (!tid || !window.__fbPushAudit) return;
      const entryData = { ts: Date.now(), deviceId: getDeviceId(), device: getDeviceName(), action, detail, undoData, ...(extra||{}) };
      // Generate the real Firebase push key offline so the local entry has the correct id from the start
      const pushKey = window.__fbAuditKey ? window.__fbAuditKey(tid) : null;
      if (pushKey) {
        setAuditLog(prev => [{ id: pushKey, _local: true, ...entryData }, ...prev]);
      }
      window.__fbPushAudit(tid, entryData, pushKey)
        .catch(err => console.warn("[pushAudit] Firebase write failed:", err));
    } catch(e) { console.warn("[pushAudit] error:", e); }
  }

  const addPlayer = useCallback(p => {
    setRoster(r => [...r, p]);
    pushAudit("ADD_PITCHER", `Added ${p.name} #${p.jersey}`, { type:"DELETE_PITCHER", pitcherId: p.id });
  }, []);

  const deletePlayer = useCallback(id => {
    const pitcher = rosterRef.current.find(p => p.id === id);
    setRoster(r => r.filter(p => p.id !== id));
    setSelectedPlayer(null);
    if (pitcher) pushAudit("DELETE_PITCHER", `Deleted ${pitcher.name} #${pitcher.jersey}`, { type:"RESTORE_PITCHER", pitcher });
  }, []);

  const editPlayer = useCallback((id, updates) => {
    const pitcher = rosterRef.current.find(p => p.id === id);
    setRoster(r => r.map(p => p.id === id ? {...p,...updates} : p));
    setSelectedPlayer(prev => prev && prev.id === id ? {...prev,...updates} : prev);
    if (pitcher && (updates.name !== undefined || updates.jersey !== undefined)) {
      pushAudit("EDIT_PITCHER", `Edited ${updates.name || pitcher.name} #${updates.jersey ?? pitcher.jersey}`,
        { type:"RESTORE_PITCHER_META", pitcherId: id, name: pitcher.name, jersey: pitcher.jersey });
    }
  }, []);

  const addTourney = useCallback(t => {
    setTournaments(ts => [...ts, t]);
    pushAudit("ADD_TOURNEY", `Added tournament "${t.name}"`, { type:"DELETE_TOURNEY", tourneyId: t.id });
  }, []);

  const deleteTourney = useCallback(id => {
    const tourney = tournamentsRef.current.find(t => t.id === id);
    setTournaments(ts => ts.filter(t => t.id !== id));
    if (tourney) pushAudit("DELETE_TOURNEY", `Deleted tournament "${tourney.name}"`, { type:"RESTORE_TOURNEY", tourney });
  }, []);

  const updateTourney = useCallback(t => {
    const old = tournamentsRef.current.find(x => x.id === t.id);
    setTournaments(ts => ts.map(x => x.id === t.id ? t : x));
    if (old) pushAudit("EDIT_TOURNEY", `Edited tournament "${t.name}"`, { type:"RESTORE_TOURNEY", tourney: old });
  }, []);

  const logGame = useCallback((playerId, gameData) => {
    const entry = { ...gameData, gameId: gameData.gameId || newId() };
    const player = rosterRef.current.find(p => p.id === playerId);
    setRoster(r => r.map(p => {
      if (p.id !== playerId) return p;
      const history = [...(p.history||[]), entry];
      return { ...p, ...recomputeLast(history), history };
    }));
    setSelectedPlayer(prev => {
      if (!prev || prev.id !== playerId) return prev;
      const history = [...(prev.history||[]), entry];
      return { ...prev, ...recomputeLast(history), history };
    });
    const gi = { date:entry.date, opponent:entry.opponent||null, isTournament:!!entry.isTournament, tournamentName:entry.tournamentName||null, tourneyDay:entry.tourneyDay||null };
    pushAudit("LOG_GAME", `${player?.name||playerId}: ${entry.pitches}p`,
      { type:"DELETE_GAME", playerId, gameId: entry.gameId },
      { gameInfo: gi, pitcherName: player?.name||playerId, pitches: entry.pitches });
  }, []);

  const logMultiple = useCallback((playerId, gameData) => {
    const entry = { ...gameData, gameId: gameData.gameId || newId() };
    const player = rosterRef.current.find(p => p.id === playerId);
    setRoster(r => r.map(p => {
      if (p.id !== playerId) return p;
      const history = [...(p.history||[]), entry];
      return { ...p, ...recomputeLast(history), history };
    }));
    const gi = { date:entry.date, opponent:entry.opponent||null, isTournament:!!entry.isTournament, tournamentName:entry.tournamentName||null, tourneyDay:entry.tourneyDay||null };
    pushAudit("LOG_GAME", `${player?.name||playerId}: ${entry.pitches}p`,
      { type:"DELETE_GAME", playerId, gameId: entry.gameId },
      { sharedGameId: entry.sharedGameId||null, gameInfo: gi, pitcherName: player?.name||playerId, pitches: entry.pitches });
  }, []);

  const editGame = useCallback((playerId, gameId, updatedData) => {
    const player = rosterRef.current.find(p => p.id === playerId);
    const oldEntry = player?.history?.find(h => h.gameId === gameId);
    setRoster(r => r.map(p => {
      if (p.id !== playerId) return p;
      const history = (p.history||[]).map(h => h.gameId === gameId ? {...h,...updatedData} : h);
      return { ...p, ...recomputeLast(history), history };
    }));
    setSelectedPlayer(prev => {
      if (!prev || prev.id !== playerId) return prev;
      const history = (prev.history||[]).map(h => h.gameId === gameId ? {...h,...updatedData} : h);
      return { ...prev, ...recomputeLast(history), history };
    });
    if (oldEntry) {
      pushAudit("EDIT_GAME",
        `Edited game for ${player?.name || playerId} on ${oldEntry.date} (${oldEntry.pitches}p → ${updatedData.pitches ?? oldEntry.pitches}p)`,
        { type:"RESTORE_GAME", playerId, entry: oldEntry });
    }
  }, []);

  const deleteGame = useCallback((playerId, gameId) => {
    const player = rosterRef.current.find(p => p.id === playerId);
    const entry = player?.history?.find(h => h.gameId === gameId);
    setRoster(r => r.map(p => {
      if (p.id !== playerId) return p;
      const history = (p.history||[]).filter(h => h.gameId !== gameId);
      return { ...p, ...recomputeLast(history), history };
    }));
    setSelectedPlayer(prev => {
      if (!prev || prev.id !== playerId) return prev;
      const history = (prev.history||[]).filter(h => h.gameId !== gameId);
      return { ...prev, ...recomputeLast(history), history };
    });
    if (entry) {
      pushAudit("DELETE_GAME",
        `Deleted game for ${player?.name || playerId} on ${entry.date} (${entry.pitches}p)`,
        { type:"RESTORE_GAME", playerId, entry });
    }
  }, []);

  const restoreGame = useCallback((playerId, entry) => {
    setRoster(r => r.map(p => {
      if (p.id !== playerId) return p;
      const exists = (p.history||[]).some(h => h.gameId === entry.gameId);
      const history = exists
        ? (p.history||[]).map(h => h.gameId === entry.gameId ? entry : h)
        : [...(p.history||[]), entry].sort((a,b) => (a.date||'').localeCompare(b.date||''));
      return { ...p, ...recomputeLast(history), history };
    }));
    setSelectedPlayer(prev => {
      if (!prev || prev.id !== playerId) return prev;
      const exists = (prev.history||[]).some(h => h.gameId === entry.gameId);
      const history = exists
        ? (prev.history||[]).map(h => h.gameId === entry.gameId ? entry : h)
        : [...(prev.history||[]), entry].sort((a,b) => (a.date||'').localeCompare(b.date||''));
      return { ...prev, ...recomputeLast(history), history };
    });
  }, []);

  const executeUndo = useCallback((undoData) => {
    if (!undoData) return;
    switch (undoData.type) {
      case "DELETE_GAME":          deleteGame(undoData.playerId, undoData.gameId);  break;
      case "RESTORE_GAME":         restoreGame(undoData.playerId, undoData.entry);  break;
      case "DELETE_PITCHER":       deletePlayer(undoData.pitcherId);                break;
      case "RESTORE_PITCHER":      setRoster(r => [...r, undoData.pitcher]);        break;
      case "RESTORE_PITCHER_META": editPlayer(undoData.pitcherId, { name:undoData.name, jersey:undoData.jersey }); break;
      case "DELETE_TOURNEY":       deleteTourney(undoData.tourneyId);               break;
      case "RESTORE_TOURNEY":
        setTournaments(ts => {
          const exists = ts.some(t => t.id === undoData.tourney.id);
          return exists
            ? ts.map(t => t.id === undoData.tourney.id ? undoData.tourney : t)
            : [...ts, undoData.tourney];
        });
        break;
      default: break;
    }
  }, [deleteGame, restoreGame, deletePlayer, editPlayer, deleteTourney]);

  // ── Team picker screen ──────────────────────────────────────────────────
  if (!teamId || showTeamPicker) {
    return <TeamPickerScreen onSelect={selectTeam} showManage={showTeamPicker}
      onTeamMetaUpdate={(id, updatedMeta) => {
        if (id === teamId) {
          const merged = { ...teamMeta, ...updatedMeta };
          localStorage.setItem(TEAM_META_KEY, JSON.stringify(merged));
          setTeamMeta(merged);
        }
      }}/>;
  }

  // ── Loading splash ──────────────────────────────────────────────────────
  if (!loaded) return (
    <div style={{ background:"#080c14", minHeight:"100vh", display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center", gap:16 }}>
      <img src={LOGO_URI} alt="Prime Baseball" style={{ width:64, height:64, borderRadius:"50%" }}/>
      <div style={{ fontSize:20, fontWeight:800, color:"rgba(255,255,255,0.85)", fontFamily:"'Bebas Neue',cursive", letterSpacing:2 }}>PRIME PITCHING</div>
      <div style={{ fontSize:13, color:"rgba(255,255,255,0.4)", marginTop:-8 }}>{teamMeta?.name}</div>
      <div className="spinner" style={{ fontSize:22, marginTop:4 }}>⟳</div>
      <div style={{ fontSize:12, color:"rgba(255,255,255,0.25)", marginTop:-8 }}>Connecting…</div>
    </div>
  );

  const availableCount = roster.filter(p=>getAvailabilityStatus(p, null, tournaments)==="available").length;
  const restingCount   = roster.filter(p=>getAvailabilityStatus(p, null, tournaments)!=="available").length;

  return (
    <div style={{ background:"#080c14", minHeight:"100vh", maxWidth:430, margin:"0 auto",
      fontFamily:"'Barlow',sans-serif", color:"#f8fafc", position:"relative", overflowX:"hidden",
      backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(30,58,138,0.25) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(22,101,52,0.15) 0%,transparent 60%)" }}>

      {syncStatus==="offline" && (
        <div className="offline-banner" style={{ background:"rgba(244,63,94,0.12)", borderBottom:"1px solid rgba(244,63,94,0.3)",
          padding:"8px 16px", display:"flex", alignItems:"center", gap:8,
          fontSize:12, color:"#f87171", fontWeight:600, position:"sticky", top:0, zIndex:30 }}>
          {I.warning} Offline — changes will sync when reconnected
        </div>
      )}

      {/* ── Header ── */}
      <div style={{ background:"rgba(8,12,20,0.9)", backdropFilter:"blur(16px)",
        borderBottom:"1px solid rgba(255,255,255,0.06)",
        padding:"10px 14px",
        position:"sticky", top:syncStatus==="offline"?33:0, zIndex:20 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          {/* Logo */}
          <img src={LOGO_URI} alt="Prime Baseball" style={{ width:36, height:36, borderRadius:"50%", flexShrink:0 }}/>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:10, color:"rgba(255,255,255,0.35)", letterSpacing:1, fontWeight:600, textTransform:"uppercase" }}>PRIME PITCHING · {APP_VERSION}</div>
            <div style={{ fontSize:17, fontWeight:900, color:"#38bdf8", fontFamily:"'Bebas Neue',cursive", letterSpacing:2, lineHeight:1.1,
              whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
              {teamMeta?.name || "Select Team"}
            </div>
          </div>
          <div style={{ display:"flex", gap:5, alignItems:"center" }}>
            {availableCount>0 && <div style={{ padding:"3px 8px", borderRadius:8, background:"rgba(74,222,128,0.15)", fontSize:11, fontWeight:700, color:"#4ade80" }}>{availableCount}✓</div>}
            {restingCount>0  && <div style={{ padding:"3px 8px", borderRadius:8, background:"rgba(244,63,94,0.15)",  fontSize:11, fontWeight:700, color:"#f43f5e" }}>{restingCount}😴</div>}
            <div title={syncStatus} style={{ width:7, height:7, borderRadius:"50%", flexShrink:0,
              background: syncStatus==="synced"?"#4ade80": syncStatus==="saving"?"#fbbf24": syncStatus==="offline"?"#f43f5e":"rgba(255,255,255,0.3)",
              boxShadow:  syncStatus==="synced"?"0 0 6px #4ade80": syncStatus==="saving"?"0 0 6px #fbbf24": syncStatus==="offline"?"0 0 6px #f43f5e":"none",
              transition:"background 0.4s, box-shadow 0.4s" }}/>
            <button onClick={()=>setShowTeamPicker(true)}
              style={{ background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.1)",
                borderRadius:8, padding:"5px 8px", color:"rgba(255,255,255,0.5)", cursor:"pointer",
                fontSize:11, fontWeight:700, letterSpacing:0.5 }}>
              TEAM
            </button>
          </div>
        </div>
      </div>

      {/* ── Screens ── */}
      <div>
        {tab==="roster" && selectedPlayer ? (
          <ScreenBoundary onBack={()=>setSelectedPlayer(null)}>
            <PitcherDetail pitcher={selectedPlayer} onBack={()=>setSelectedPlayer(null)}
              onLog={logGame} onDelete={deletePlayer} tournaments={tournaments}
              onEditGame={editGame} onDeleteGame={deleteGame} onEditPlayer={editPlayer}/>
          </ScreenBoundary>
        ) : tab==="roster" ? (
          <RosterScreen roster={roster} tournaments={tournaments} onAdd={addPlayer} onSelect={p=>setSelectedPlayer(p)} onEditPlayer={editPlayer}/>
        ) : tab==="gamelog" ? (
          <GameLogScreen roster={roster} onLogMultiple={logMultiple} tournaments={tournaments}
            onEditGame={editGame} onDeleteGame={deleteGame}/>
        ) : tab==="eligibility" ? (
          <EligibilityScreen roster={roster} tournaments={tournaments}/>
        ) : tab==="tournament" ? (
          <TournamentScreen roster={roster} tournaments={tournaments} onAddTourney={addTourney} onDeleteTourney={deleteTourney} onUpdateTourney={updateTourney}/>
        ) : tab==="activity" ? (
          <ActivityScreen auditLog={auditLog} roster={roster} onUndo={executeUndo}
            undidIds={undidIds} onUndid={id => {
              setUndidIds(s => new Set([...s, id]));
              if (window.__fbMarkAuditUndone) window.__fbMarkAuditUndone(teamId, id);
            }}/>
        ) : (
          <ScreenBoundary>
            <SeasonHistory roster={roster} tournaments={tournaments} onEditGame={editGame} onDeleteGame={deleteGame}/>
          </ScreenBoundary>
        )}
      </div>

      {/* ── Bottom nav ── */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:430, background:"rgba(8,12,20,0.97)", backdropFilter:"blur(20px)",
        borderTop:"1px solid rgba(255,255,255,0.07)", paddingBottom:"env(safe-area-inset-bottom,0px)" }}>
        <div style={{ display:"flex" }}>
          {TABS.map(t=>{
            const active = (tab===t.id && !selectedPlayer) || (tab==="roster" && selectedPlayer && t.id==="roster");
            return (
              <button key={t.id} onClick={()=>{ setTab(t.id); if(t.id!=="roster") setSelectedPlayer(null); }}
                style={{ flex:1, background:"transparent", border:"none", cursor:"pointer",
                  padding:"9px 0 7px", display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
                <div style={{ color:active?"#38bdf8":"rgba(255,255,255,0.3)", transition:"color 0.2s" }}>{t.icon}</div>
                <span style={{ fontSize:10, fontWeight:700, letterSpacing:0.5,
                  color:active?"#38bdf8":"rgba(255,255,255,0.3)", transition:"color 0.2s" }}>
                  {t.label.toUpperCase()}
                </span>
                {active && <div style={{ width:14, height:2, background:"#38bdf8", borderRadius:1 }}/>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Activity Screen ───────────────────────────────────────────────────────────

function ActivityScreen({ auditLog, roster, onUndo, undidIds, onUndid }) {
  function formatTs(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    const diffMins = Math.floor((Date.now() - ts) / 60000);
    if (diffMins < 1) return "just now";
    if (diffMins < 60) return `${diffMins}m ago`;
    const diffHrs = Math.floor(diffMins / 60);
    if (diffHrs < 24) return `${diffHrs}h ago`;
    return d.toLocaleDateString([], { month:"short", day:"numeric" }) + " " + d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  }

  const actionMeta = {
    LOG_GAME:       { label:"Game Logged",    color:"#4ade80" },
    DELETE_GAME:    { label:"Game Deleted",   color:"#f43f5e" },
    EDIT_GAME:      { label:"Game Edited",    color:"#fbbf24" },
    ADD_PITCHER:    { label:"Pitcher Added",  color:"#4ade80" },
    DELETE_PITCHER: { label:"Pitcher Deleted",color:"#f43f5e" },
    EDIT_PITCHER:   { label:"Pitcher Edited", color:"#fbbf24" },
    ADD_TOURNEY:    { label:"Tourney Added",  color:"#4ade80" },
    DELETE_TOURNEY: { label:"Tourney Deleted",color:"#f43f5e" },
    EDIT_TOURNEY:   { label:"Tourney Edited", color:"#fbbf24" },
  };

  // Per subject, only the most-recent non-undone entry can be undone.
  // auditLog is already reverse-chronological (newest first).
  const canUndoSet = new Set();
  const seenSubjects = new Set();
  for (const entry of auditLog) {
    if (!entry.undoData) continue;
    const key = getSubjectKey(entry.undoData);
    if (!key || seenSubjects.has(key)) continue;
    if (!undidIds.has(entry.id)) {
      canUndoSet.add(entry.id);
      seenSubjects.add(key);
    }
    // Undone entries don't block the subject — the next older entry becomes undoable
  }

  function handleUndo(entry) {
    onUndid(entry.id);
    onUndo(entry.undoData);
  }

  const myDeviceId = getDeviceId();

  // Build display list: group LOG_GAME entries that share a sharedGameId into one card.
  const displayItems = [];
  const seenSharedIds = new Set();
  for (const entry of auditLog) {
    if (entry.action === "LOG_GAME" && entry.sharedGameId) {
      if (seenSharedIds.has(entry.sharedGameId)) continue;
      seenSharedIds.add(entry.sharedGameId);
      const group = auditLog.filter(e => e.action === "LOG_GAME" && e.sharedGameId === entry.sharedGameId);
      displayItems.push({ kind:"logGame", entries: group, gameInfo: entry.gameInfo, ts: entry.ts, device: entry.device, deviceId: entry.deviceId });
    } else if (entry.action === "LOG_GAME" && entry.gameInfo) {
      displayItems.push({ kind:"logGame", entries:[entry], gameInfo: entry.gameInfo, ts: entry.ts, device: entry.device, deviceId: entry.deviceId });
    } else {
      displayItems.push({ kind:"other", entry });
    }
  }

  function renderUndoBtn(entry) {
    if (!canUndoSet.has(entry.id)) return null;
    return (
      <button onClick={() => handleUndo(entry)}
        style={{ flexShrink:0, minWidth:52, height:30,
          background:"rgba(251,191,36,0.12)", border:"1px solid rgba(251,191,36,0.3)",
          borderRadius:8, padding:"0 10px", color:"#fbbf24", fontSize:11, fontWeight:700,
          cursor:"pointer", letterSpacing:0.3 }}>
        UNDO
      </button>
    );
  }

  return (
    <div style={{ padding:"16px 16px 120px" }}>
      <p style={sectionLabel}>RECENT ACTIVITY</p>
      {auditLog.length === 0 ? (
        <div style={{ textAlign:"center", padding:"40px 0", color:"rgba(255,255,255,0.3)", fontSize:14 }}>
          No activity recorded yet
        </div>
      ) : displayItems.map((item, idx) => {
        if (item.kind === "logGame") {
          const gi = item.gameInfo || {};
          const isMyDevice = item.deviceId === myDeviceId;
          const gameContext = gi.isTournament
            ? `${gi.tournamentName || "Tournament"}${gi.tourneyDay ? ` · Day ${gi.tourneyDay}` : ""}`
            : "Regular Season";
          return (
            <div key={item.entries[0].id} style={{ ...card, marginBottom:10 }}>
              <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
                <div style={{ width:8, height:8, borderRadius:"50%", background:"#4ade80", flexShrink:0, marginTop:5 }}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                    <span style={{ fontSize:12, fontWeight:700, color:"#4ade80", letterSpacing:0.3 }}>Game Logged</span>
                    <span style={{ fontSize:10, color: isMyDevice ? "rgba(56,189,248,0.6)" : "rgba(255,255,255,0.3)", fontWeight:600, wordBreak:"break-word" }}>
                      {item.device || "Another device"}{isMyDevice ? " (this device)" : ""}
                    </span>
                  </div>
                  <div style={{ fontSize:13, color:"rgba(255,255,255,0.6)", marginTop:3 }}>
                    {formatDate(gi.date)}{gi.opponent ? ` · vs ${gi.opponent}` : ""} · {gameContext}
                  </div>
                  {item.entries.map(e => {
                    const didUndo = undidIds.has(e.id);
                    return (
                      <div key={e.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
                        marginTop:6, paddingTop:6, borderTop:"1px solid rgba(255,255,255,0.06)",
                        opacity: didUndo ? 0.45 : 1, transition:"opacity 0.3s" }}>
                        <div>
                          <span style={{ fontSize:14, fontWeight:700, color:"#f8fafc" }}>
                            {e.pitcherName || e.detail}
                          </span>
                          <span style={{ fontSize:13, color:"rgba(255,255,255,0.55)", marginLeft:6 }}>
                            {e.pitches != null ? `${e.pitches}p` : ""}
                          </span>
                          {didUndo && <span style={{ fontSize:11, color:"#fbbf24", marginLeft:8, fontWeight:700 }}>↩ Undone</span>}
                        </div>
                        {renderUndoBtn(e)}
                      </div>
                    );
                  })}
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:6 }}>{formatTs(item.ts)}</div>
                </div>
              </div>
            </div>
          );
        }

        const { entry } = item;
        const meta = actionMeta[entry.action] || { label: entry.action, color:"rgba(255,255,255,0.5)" };
        const didUndo = undidIds.has(entry.id);
        const canUndo = canUndoSet.has(entry.id);
        const isMyDevice = entry.deviceId === myDeviceId;
        return (
          <div key={entry.id} style={{ ...card, marginBottom:10, opacity: didUndo ? 0.4 : 1, transition:"opacity 0.3s" }}>
            <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background:meta.color, flexShrink:0, marginTop:5 }}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                  <span style={{ fontSize:12, fontWeight:700, color:meta.color, letterSpacing:0.3 }}>{meta.label}</span>
                  <span style={{ fontSize:10, color: isMyDevice ? "rgba(56,189,248,0.6)" : "rgba(255,255,255,0.3)", fontWeight:600, wordBreak:"break-word" }}>
                    {entry.device || "Another device"}{isMyDevice ? " (this device)" : ""}
                  </span>
                </div>
                <div style={{ fontSize:13, color:"rgba(255,255,255,0.75)", marginTop:2, lineHeight:1.4 }}>
                  {entry.detail}
                </div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:3 }}>{formatTs(entry.ts)}</div>
                {didUndo && <div style={{ fontSize:11, color:"#fbbf24", marginTop:2, fontWeight:700 }}>↩ Undone</div>}
              </div>
              {canUndo && renderUndoBtn(entry)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

window.__PitchApp = App;


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(window.__PitchApp));
  </script>

  <!-- Service worker for offline shell -->

  <script>
    // Version check: compare the version in the currently-running HTML against what the
    // server actually has right now. Uses a live network fetch (cache:no-store) so that
    // iOS PWA's native page cache can't hide a new deploy. Reloads + clears caches on mismatch.
    (function() {
      const VERSION_KEY = 'pt_app_version';
      const running = document.querySelector('meta[name="app-version"]')?.content || '';

      function applyUpdate(latest) {
        localStorage.setItem(VERSION_KEY, latest);
        const clear = 'caches' in window
          ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))))
          : Promise.resolve();
        clear.then(() => location.reload(true));
      }

      // Always store the running version so we have a baseline.
      if (running) localStorage.setItem(VERSION_KEY, running);

      // Fetch the live page from the network (bypasses every cache layer).
      fetch(location.pathname + '?_v=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Accept': 'text/html' }
      })
      .then(r => r.ok ? r.text() : null)
      .then(html => {
        if (!html) return;
        const m = html.match(/name="app-version"\s+content="([^"]+)"/);
        const latest = m && m[1];
        if (latest && latest !== running) applyUpdate(latest);
      })
      .catch(() => {}); // silent fail when offline
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE = 'pitch-tracker-fb-v6';
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.add(location.href)).then(() => self.skipWaiting()));
          });
          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys().then(keys =>
                Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
              ).then(() => self.clients.claim())
            );
          });
          self.addEventListener('fetch', e => {
            // Let Firebase/network requests pass through uncached
            if (e.request.url.includes('firebaseio.com') ||
                e.request.url.includes('googleapis.com') ||
                e.request.url.includes('gstatic.com')) {
              e.respondWith(fetch(e.request).catch(() => new Response('', {status: 503})));
              return;
            }
            // Network-first for HTML navigation AND every same-origin file
            // (lib/*.js, assets/*, manifest.json) so a deploy is picked up
            // immediately - these aren't version-pinned by URL like the CDN
            // libs below are, so cache-first would serve stale code after a
            // version bump.
            const sameOrigin = new URL(e.request.url).origin === location.origin;
            if (e.request.mode === 'navigate' || sameOrigin) {
              e.respondWith(
                fetch(e.request).then(res => {
                  if (res && res.status === 200) {
                    caches.open(CACHE).then(c => c.put(e.request, res.clone()));
                  }
                  return res;
                }).catch(() => caches.match(e.request))
              );
              return;
            }
            // Cache-first for static, version-pinned third-party CDN assets (React/Babel)
            e.respondWith(
              caches.match(e.request).then(r => r || fetch(e.request).then(res => {
                if (res && res.status === 200 && e.request.method === 'GET') {
                  caches.open(CACHE).then(c => c.put(e.request, res.clone()));
                }
                return res;
              }).catch(() => caches.match(e.request)))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
